server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API代理配置（MySQL版本）
    # resolver 127.0.0.11 是 Docker 内置 DNS，确保容器启动时不阻塞解析
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /docker-api/ {
        proxy_pass http://ruoyi-backend-my:9099/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 系统接口（Swagger UI / Redoc）相关代理：
    # iframe src = '/proxy-docs'，swagger/redoc HTML 内部还有相对路径 '/openapi.json'，
    # 这两个路径不会落到 /docker-api/ 下，必须显式代理到后端，否则会被
    # try_files $uri $uri/ /index.html 当成 SPA 路由，渲染项目自己的 404。
    # 注意 proxy_pass 末尾不带 /，原样转发路径。
    # 详细分析：docs/04-开发/DEBUG/swagger-ui-relative-openapi-yaml-exception-2026-07-11.md
    location = /proxy-docs {
        proxy_pass http://ruoyi-backend-my:9099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /proxy-openapi.json {
        proxy_pass http://ruoyi-backend-my:9099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /proxy-redoc {
        proxy_pass http://ruoyi-backend-my:9099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://ruoyi-backend-my:9099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}