# ============================================================================
# Pre-commit 配置：保护 ORM 改动时同步 alembic 迁移，避免 1054 错误。
#
# 用法：
#   pip install pre-commit
#   pre-commit install
#
# 跳过一次：git commit --no-verify
# 跳过某个钩子：SKIP=check-orm-alembic-sync git commit -m "..."
#
# 详细：ruoyi-fastapi-backend/.pre-commit-hooks/check_orm_alembic_sync.py
# 文档：docs/04-开发/DEBUG/orm-vs-alembic-sync-2026-07-12.md
# ============================================================================
